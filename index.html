<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Chronicles of Trust: The Ethical Archivist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --emerald-glow: rgba(16, 185, 129, 0.4);
            --slate-bg: #020617;
            
            /* Era Specific Tokens */
            --era-accent: 16, 185, 129; /* Emerald default */
            --era-background: 2, 6, 23;
            --era-text: 241, 245, 249;
            --era-border: rgba(16, 185, 129, 0.1);
        }

        /* Era Skins */
        .era-0 { /* 10,000 BCE - Primal */
            --era-accent: 249, 115, 22; /* Orange/Fire */
            --era-border: rgba(249, 115, 22, 0.2);
            --era-background: 12, 10, 9;
        }

        .era-1 { /* 300 BCE - Civics */
            --era-accent: 234, 179, 8; /* Gold/Marble */
            --era-border: rgba(234, 179, 8, 0.2);
            --era-background: 15, 23, 42;
        }

        .era-2 { /* 1720 CE - Trade */
            --era-accent: 14, 165, 233; /* Ocean Blue */
            --era-border: rgba(14, 165, 233, 0.2);
        }

        .era-3 { /* 1885 CE - Industry */
            --era-accent: 244, 63, 94; /* Rose/Steel */
            --era-border: rgba(244, 63, 94, 0.2);
            --era-background: 9, 9, 11;
        }

        .era-4 { /* 2025 CE - Global */
            --era-accent: 139, 92, 246; /* Violet/Digital */
            --era-border: rgba(139, 92, 246, 0.3);
            --era-background: 3, 7, 18;
        }

        .era-5 { /* 2150 CE - Future */
            --era-accent: 45, 212, 191; /* Teal/Matrix */
            --era-border: rgba(45, 212, 191, 0.3);
            --era-background: 2, 6, 23;
        }

        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            background-color: var(--slate-bg);
            color: #f1f5f9;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Immersive Grid Background */
        .grid-bg {
            background-image:
                linear-gradient(to right, rgba(16, 185, 129, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(16, 185, 129, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at center, black, transparent 80%);
        }

        @keyframes glitch {
            0% {
                transform: translate(0);
                clip-path: inset(0 0 0 0);
            }

            20% {
                transform: translate(-3px, 2px);
                clip-path: inset(10% 0 40% 0);
                filter: hue-rotate(90deg);
            }

            40% {
                transform: translate(-3px, -2px);
                clip-path: inset(50% 0 10% 0);
            }

            60% {
                transform: translate(3px, 2px);
                clip-path: inset(30% 0 20% 0);
                filter: hue-rotate(180deg);
            }

            80% {
                transform: translate(3px, -2px);
                clip-path: inset(15% 0 60% 0);
            }

            100% {
                transform: translate(0);
                clip-path: inset(0 0 0 0);
            }
        }

        .animate-glitch {
            animation: glitch 0.4s cubic-bezier(.25, .46, .45, .94) both infinite;
        }

        /* Portal Transition Effect */
        @keyframes portal-in {
            0% { transform: scale(0.8); opacity: 0; filter: blur(20px); }
            100% { transform: scale(1.1); opacity: 1; filter: blur(0px); }
        }

        @keyframes portal-out {
            0% { transform: scale(1.1); opacity: 1; filter: blur(0px); }
            100% { transform: scale(1.5); opacity: 0; filter: blur(40px); }
        }

        .portal-active {
            animation: portal-in 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .portal-exit {
            animation: portal-out 0.4s cubic-bezier(0.7, 0, 0.84, 0) forwards;
        }

        /* Enhanced SOTA Glassmorphism */
        .glass-vibrant {
            background: rgba(var(--era-background), 0.6);
            backdrop-filter: blur(40px) saturate(200%);
            border: 1px solid rgba(var(--era-accent), 0.4);
            box-shadow: 
                0 12px 48px 0 rgba(0, 0, 0, 0.6),
                inset 0 0 40px rgba(var(--era-accent), 0.1);
            position: relative;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-vibrant::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
            pointer-events: none;
        }

        /* Scroll Gradient Fade Utility */
        .scroll-fade {
            mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
        }

        /* Scanline effect */
        .scanlines::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        @media print {

            aside,
            button,
            .no-print,
            .absolute-branding {
                display: none !important;
            }

            body {
                background: white !important;
                color: black !important;
                overflow: visible !important;
            }

            #root {
                display: block !important;
            }

            main {
                padding: 0 !important;
                background: white !important;
            }
        }
    </style>
</head>

<body class="selection:bg-emerald-500/30">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>

</html>
