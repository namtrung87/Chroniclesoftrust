<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Chronicles of Trust: The Ethical Archivist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --emerald-glow: rgba(16, 185, 129, 0.4);
            --slate-bg: #020617;
        }

        body {
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            background-color: var(--slate-bg);
            color: #f1f5f9;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        /* Immersive Grid Background */
        .grid-bg {
            background-image:
                linear-gradient(to right, rgba(16, 185, 129, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(16, 185, 129, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: radial-gradient(circle at center, black, transparent 80%);
        }

        @keyframes glitch {
            0% {
                transform: translate(0);
                clip-path: inset(0 0 0 0);
            }

            20% {
                transform: translate(-3px, 2px);
                clip-path: inset(10% 0 40% 0);
                filter: hue-rotate(90deg);
            }

            40% {
                transform: translate(-3px, -2px);
                clip-path: inset(50% 0 10% 0);
            }

            60% {
                transform: translate(3px, 2px);
                clip-path: inset(30% 0 20% 0);
                filter: hue-rotate(180deg);
            }

            80% {
                transform: translate(3px, -2px);
                clip-path: inset(15% 0 60% 0);
            }

            100% {
                transform: translate(0);
                clip-path: inset(0 0 0 0);
            }
        }

        .animate-glitch {
            animation: glitch 0.4s cubic-bezier(.25, .46, .45, .94) both infinite;
        }

        /* Glassmorphism utility */
        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(16, 185, 129, 0.1);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, transparent, rgba(16, 185, 129, 0.5), transparent);
            border-radius: 10px;
        }

        /* Scanline effect */
        .scanlines::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        @media print {

            aside,
            button,
            .no-print,
            .absolute-branding {
                display: none !important;
            }

            body {
                background: white !important;
                color: black !important;
                overflow: visible !important;
            }

            #root {
                display: block !important;
            }

            main {
                padding: 0 !important;
                background: white !important;
            }
        }
    </style>
</head>

<body class="selection:bg-emerald-500/30">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>

</html>
